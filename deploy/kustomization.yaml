# What Flux applies. A release is a bump of the image tags below, after CI is
# green — never a `latest` that changes under a running pod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubitor

resources:
  - priority.yaml
  - rbac.yaml
  - pvc.yaml
  - server.yaml
  - client.yaml
  - agent.yaml
  - ingress.yaml
  # networkpolicy.yaml is deliberately absent: it has to name the namespace your
  # ingress controller runs in, and a wrong guess makes the dashboard
  # unreachable with nothing in any log to explain it. `examples/overlay` shows
  # how to add it once you know the name.

# `commonLabels` would push this into the Deployment selector, which is
# immutable; `includeSelectors: false` keeps it a label only.
labels:
  - pairs:
      app.kubernetes.io/part-of: kubitor
    includeSelectors: false

images:
  - name: ghcr.io/ridanit-ruma/kubitor-server
    newTag: sha-7fbb19036af2c971c539be7373b348a9e3a41490
  - name: ghcr.io/ridanit-ruma/kubitor-client
    newTag: sha-7fbb19036af2c971c539be7373b348a9e3a41490
  - name: ghcr.io/ridanit-ruma/kubitor-agent
    newTag: sha-7fbb19036af2c971c539be7373b348a9e3a41490
