apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubitor-server
  namespace: kubitor
spec:
  # SQLite on a ReadWriteOnce volume: exactly one writer, and Recreate so the
  # old pod releases the volume before the new one claims it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubitor
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubitor
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: kubitor-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/ridanit-ruma/kubitor-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: '3001'
            - name: KUBITOR_DB_KIND
              value: sqlite
            - name: KUBITOR_SQLITE_PATH
              value: /var/lib/kubitor/kubitor.db
            # Cloudflare terminates the tunnel, so this is the header that
            # carries the real caller. Throttling and the audit trail key on it.
            - name: KUBITOR_TRUSTED_PROXY_HEADER
              value: cf-connecting-ip
          envFrom:
            - secretRef:
                name: kubitor-server
          volumeMounts:
            - name: data
              mountPath: /var/lib/kubitor
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubitor-data-v2
---
apiVersion: v1
kind: Service
metadata:
  name: kubitor-server
  namespace: kubitor
spec:
  selector:
    app.kubernetes.io/name: kubitor
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 3001
      targetPort: http
