apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubitor-client
  namespace: kubitor
spec:
  # Two, on different nodes. The dashboard holds no state, so the only reason it
  # was ever one replica was that nobody had said otherwise — and one replica
  # means a node reboot takes the screen down with it.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubitor
      app.kubernetes.io/component: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubitor
        app.kubernetes.io/component: client
    spec:
      # The dashboard never talks to the Kubernetes API; only the server does.
      automountServiceAccountToken: false
      priorityClassName: kubitor-critical
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      # Spread rather than pinned: `ScheduleAnyway` so a three-node cluster that
      # cannot honour it still runs both replicas rather than leaving one
      # Pending — which would be a worse answer than two on one node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubitor
              app.kubernetes.io/component: client
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: ghcr.io/ridanit-ruma/kubitor-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: '3000'
            - name: HOSTNAME
              value: 0.0.0.0
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
# One replica may go at a time, so a rolling node drain cannot take the whole
# dashboard down on its way through the cluster.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubitor-client
  namespace: kubitor
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubitor
      app.kubernetes.io/component: client
---
apiVersion: v1
kind: Service
metadata:
  name: kubitor-client
  namespace: kubitor
spec:
  selector:
    app.kubernetes.io/name: kubitor
    app.kubernetes.io/component: client
  ports:
    - name: http
      port: 3000
      targetPort: http
