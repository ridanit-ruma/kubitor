apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubitor-client
  namespace: kubitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubitor
      app.kubernetes.io/component: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubitor
        app.kubernetes.io/component: client
    spec:
      # The dashboard never talks to the Kubernetes API; only the server does.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: ghcr.io/ridanit-ruma/kubitor-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: '3000'
            - name: HOSTNAME
              value: 0.0.0.0
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: kubitor-client
  namespace: kubitor
spec:
  selector:
    app.kubernetes.io/name: kubitor
    app.kubernetes.io/component: client
  ports:
    - name: http
      port: 3000
      targetPort: http
