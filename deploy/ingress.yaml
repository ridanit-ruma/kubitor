# One host, split at the edge: the dashboard is served from / and the API from
# /api, so the browser sends its session cookie same-origin with no CORS
# arrangement and the WebSocket upgrade rides the same path.
#
# The host below belongs to your cluster and not to kubitor, and so does the
# ingress class this Ingress is claimed by — which is why no class is named
# here: the cluster's default IngressClass takes it. Set both in an overlay
# rather than editing this file, so an upgrade never has to be merged by hand.
# `examples/overlay` shows the whole of it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubitor
  namespace: kubitor
spec:
  rules:
    - host: kubitor.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kubitor-server
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubitor-client
                port:
                  number: 3000
