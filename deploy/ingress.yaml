# One host, split at the edge: the dashboard is served from / and the API from
# /api, so the browser sends its session cookie same-origin with no CORS
# arrangement and the WebSocket upgrade rides the same path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubitor
  namespace: kubitor
spec:
  ingressClassName: traefik
  rules:
    - host: kubitor.myuyayam.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kubitor-server
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubitor-client
                port:
                  number: 3000
