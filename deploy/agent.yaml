# The optional half of kubitor: one pod per node, reading what the API server
# cannot see.
#
# There is no secret here to create or distribute. Each pod mounts a projected
# service-account token whose `kubernetes.io/node.name` claim the API server
# signed, and the server verifies it against the cluster's public keys. That is
# a per-node credential by construction: a compromised node cannot mint a token
# naming a different one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubitor-agent
  namespace: kubitor
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubitor-agent
  namespace: kubitor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubitor
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubitor
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: kubitor-agent
      # Host facts are per node, so a control-plane taint must not create a
      # blind spot on exactly the machines that matter most.
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      # One read of the firmware's own description of the machine, then gone.
      #
      # `/sys/firmware/dmi/tables/DMI` is mode 0400 owned by root and holds the
      # only truthful account of what memory is installed: the kernel's EDAC
      # interface, which needs no privilege, reports this hardware's LPDDR5 as
      # `Low-Power-DDR3-RAM` and its 3 GiB devices as 4 GiB.
      #
      # Root here is ownership, not power: uid 0 reading a file uid 0 owns needs
      # no capability, so every one is dropped and privilege escalation is off.
      # The agent itself keeps running as nobody and never sees the host's
      # firmware — it reads the copy this leaves behind.
      #
      # Delete this container and its two volumes on a cluster that will not
      # admit it. The agent starts either way and falls back to EDAC; the memory
      # type is the only thing lost.
      initContainers:
        - name: read-firmware
          image: ghcr.io/ridanit-ruma/kubitor-agent:latest
          imagePullPolicy: IfNotPresent
          command: [node, dist/dmi-copy.js]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
          env:
            - name: KUBITOR_DMI_SOURCE
              value: /host/firmware/dmi/tables/DMI
          volumeMounts:
            # The firmware directory rather than the table itself: `/sys/firmware`
            # exists on every Linux machine, and a hostPath naming a file that
            # some machines do not have would leave the DaemonSet unschedulable
            # exactly where it should have degraded quietly.
            - name: firmware
              mountPath: /host/firmware
              readOnly: true
            - name: dmi
              mountPath: /run/kubitor/dmi
      containers:
        - name: agent
          image: ghcr.io/ridanit-ruma/kubitor-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KUBITOR_SERVER_URL
              value: http://kubitor-server:3001
            - name: KUBITOR_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: kubitor-token
              mountPath: /var/run/secrets/kubitor
              readOnly: true
            # Sensors, clocks and GPUs are directory trees that have to be
            # walked; the two files below are mounted as single files, because
            # handing a container all of /proc when it needs two entries is a
            # habit worth not having.
            - name: hwmon
              mountPath: /sys/class/hwmon
              readOnly: true
            - name: cpu
              mountPath: /sys/devices/system/cpu
              readOnly: true
            - name: drm
              mountPath: /sys/class/drm
              readOnly: true
            - name: mounts
              mountPath: /host/mounts
              readOnly: true
            # Network is the one thing sysfs and procfs namespace per pod: read
            # from inside the container they describe the container's single
            # veth. These two come from the host's own namespace.
            - name: netdev
              mountPath: /host/net/dev
              readOnly: true
            # The whole of sysfs, because `/sys/class/net/<if>` is a symlink
            # into `/sys/devices/...`: mounting the class directory alone gives
            # links that point outside the mount and resolve to nothing.
            - name: hostsys
              mountPath: /host/sys
              readOnly: true
            # The only directory tree here, and the only one that cannot be
            # avoided: `statfs` has to be called on a path this process can
            # resolve, and a host mount point does not exist in the container.
            # Remove this volume and its mount to give up per-filesystem sizes;
            # everything else the agent reports still works, and the node's root
            # filesystem still comes from the kubelet.
            - name: hostfs
              mountPath: /host/fs
              readOnly: true
            - name: meminfo
              mountPath: /proc/meminfo
              readOnly: true
            - name: loadavg
              mountPath: /proc/loadavg
              readOnly: true
            - name: cpuinfo
              mountPath: /proc/cpuinfo
              readOnly: true
            # What the init container copied out of the firmware. Empty on a
            # machine with no SMBIOS table, which the agent treats as "ask the
            # kernel instead".
            - name: dmi
              mountPath: /run/kubitor/dmi
              readOnly: true
      volumes:
        - name: kubitor-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  # Bound to kubitor alone: a token minted for this audience is
                  # useless against the API server itself.
                  audience: kubitor
                  expirationSeconds: 3600
        - name: hwmon
          hostPath:
            path: /sys/class/hwmon
            type: Directory
        - name: cpu
          hostPath:
            path: /sys/devices/system/cpu
            type: Directory
        - name: drm
          hostPath:
            path: /sys/class/drm
            type: Directory
        - name: mounts
          hostPath:
            # The host init's view, not this pod's: `/proc/mounts` inside a
            # container describes the container.
            path: /proc/1/mounts
            type: File
        - name: netdev
          hostPath:
            path: /proc/1/net/dev
            type: File
        - name: hostsys
          hostPath:
            path: /sys
            type: Directory
        - name: hostfs
          hostPath:
            path: /
            type: Directory
        - name: meminfo
          hostPath:
            path: /proc/meminfo
            type: File
        - name: loadavg
          hostPath:
            path: /proc/loadavg
            type: File
        - name: cpuinfo
          hostPath:
            path: /proc/cpuinfo
            type: File
        - name: firmware
          hostPath:
            path: /sys/firmware
            type: Directory
        - name: dmi
          emptyDir: {}
