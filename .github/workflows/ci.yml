name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kubitor
          POSTGRES_PASSWORD: kubitor
          POSTGRES_DB: kubitor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kubitor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Every repository test runs against both dialects. PostgreSQL joins only
      # when TEST_POSTGRES_URL is set, so this is the run that keeps it honest.
      - run: pnpm test
        env:
          TEST_POSTGRES_URL: postgres://kubitor:kubitor@localhost:5432/kubitor_test
